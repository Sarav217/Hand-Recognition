<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hand Number Recognition</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#f8fafc;font:16px system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(960px,100%)}h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}p{color:#9ca8c7;margin:0 0 24px}.viewer{position:relative;overflow:hidden;border:1px solid #334064;border-radius:20px;background:#151d35;box-shadow:0 20px 70px #0006}.viewer img{display:block;width:100%;height:auto}.viewer canvas{position:absolute;left:0;top:0;width:100%;height:calc(100% - 51px);pointer-events:none}.tip{padding:16px 20px;color:#aeb9d4;font-size:14px}</style></head><body><main><h1>Hand Number Recognition</h1><p id="status">Show one or both hands to your camera.</p><section class="viewer"><img id="feed" src="{{ url_for('video_feed') }}" alt="Live webcam finger detection"><canvas id="board"></canvas><div class="tip">Left + right counts form a double digit. Show both open hands to enable drawing. Index = black brush, thumb = eraser.</div></section></main><script>const f=document.getElementById('feed'),b=document.getElementById('board'),c=b.getContext('2d');let last=null;function size(){b.width=f.clientWidth;b.height=f.clientHeight-51}addEventListener('resize',size);f.addEventListener('load',size);async function poll(){try{const s=await(await fetch('/state')).json(),l=s.left??'-',r=s.right??'-';document.getElementById('status').textContent=`Left: ${l} | Right: ${r} | Number: ${l}${r} | ${s.gesture||'Searching'}`;const h=Object.values(s.hands||{}).find(x=>x.index_up||x.thumb_up);if(s.mode&&h){const p=h.index_up?h.index:h.thumb,x=p[0]*b.width,y=p[1]*b.height;c.globalCompositeOperation=h.index_up?'source-over':'destination-out';c.strokeStyle='#000';c.lineWidth=h.index_up?7:28;c.lineCap='round';c.beginPath();if(last&&h.index_up)c.moveTo(last.x,last.y);else c.moveTo(x,y);c.lineTo(x,y);c.stroke();c.globalCompositeOperation='source-over';last=h.index_up?{x,y}:null}else last=null}catch(e){}setTimeout(poll,100)}poll();</script></body></html>
